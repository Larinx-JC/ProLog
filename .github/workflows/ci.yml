name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: No merge-conflict markers or trailing whitespace
        run: |
          if grep -RIn --exclude-dir=.git -E '^(<<<<<<<|=======|>>>>>>>)' .; then
            echo "Merge conflict markers found"; exit 1
          fi
          if grep -RIn --exclude-dir=.git --exclude-dir=node_modules -P '[ \t]+$' .; then
            echo "Trailing whitespace found"; exit 1
          fi

  backend-unit:
    name: backend-unit (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install locked dependencies
        run: |
          python -m pip install -r requirements-lock.txt
          python -m pip install -e . --no-deps
          python -m pip check
      - name: Lint and type-check
        run: |
          python -m ruff check .
          python -m mypy app
      - name: Unit and SQLite migration tests
        run: python -m pytest -m 'not mysql' --cov=app --cov=scripts --cov-report=term-missing

  mysql-integration:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
          MYSQL_DATABASE: prolog_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: mysql+pymysql://root@127.0.0.1:3306/prolog_test
      PROLOG_TEST_MYSQL_URL: mysql+pymysql://root@127.0.0.1:3306/prolog_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install locked dependencies
        run: |
          python -m pip install -r requirements-lock.txt
          python -m pip install -e . --no-deps
          python -m pip check
      - name: Migrate and verify seeds
        run: |
          python -m alembic upgrade head
          python -m alembic check
          python scripts/verify_seed_data.py
      - name: MySQL persistence, race and rollback tests
        run: python -m pytest tests/mysql -q
      - name: Final drift check and downgrade
        run: |
          python -m alembic check
          python -m alembic downgrade base

  frontend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install, test and build
        run: |
          npm ci
          npm run lint
          npm test -- --run
          npm run build
