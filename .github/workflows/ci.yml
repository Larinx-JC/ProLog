name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No merge-conflict markers
        run: |
          if grep -RIn --exclude-dir=.git -E '^(<<<<<<<|=======|>>>>>>>)' .; then
            echo "Merge conflict markers found"; exit 1
          fi
      - name: No trailing whitespace
        run: |
          if grep -RIn --exclude-dir=.git --exclude-dir=node_modules -P '[ \t]+$' . ; then
            echo "Trailing whitespace found"; exit 1
          fi

  backend-tests:
    name: backend-tests
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
          MYSQL_DATABASE: prolog_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - name: Detect backend project
        id: detect
        run: echo "present=$( [ -f backend/pyproject.toml ] && echo true || echo false )" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        if: steps.detect.outputs.present == 'true'
        with:
          python-version: "3.12"
      - name: Install (locked deps)
        if: steps.detect.outputs.present == 'true'
        working-directory: backend
        run: |
          pip install -r requirements-lock.txt
          pip install -e . --no-deps
      - name: Lint, type-check, unit test
        if: steps.detect.outputs.present == 'true'
        working-directory: backend
        run: |
          ruff check .
          mypy app
          pytest --cov
      - name: Alembic connectivity smoke test
        if: steps.detect.outputs.present == 'true'
        working-directory: backend
        env:
          DATABASE_URL: mysql+pymysql://root@127.0.0.1:3306/prolog_test
        run: |
          alembic upgrade head
          alembic downgrade base
      - name: No backend yet
        if: steps.detect.outputs.present == 'false'
        run: echo "backend/ not present yet — nothing to test"

  frontend-tests:
    name: frontend-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Detect frontend project
        id: detect
        run: echo "present=$( [ -f frontend/package.json ] && echo true || echo false )" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        if: steps.detect.outputs.present == 'true'
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install & test
        if: steps.detect.outputs.present == 'true'
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm test -- --run
          npm run build
      - name: No frontend yet
        if: steps.detect.outputs.present == 'false'
        run: echo "frontend/ not present yet — nothing to test"
